# This file is used for Gradle options, for the rest use stonecutter.properties.toml
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.caching.debug=false
org.gradle.configuration-cache=true

# Loom variant used by `dev.kikugie.loom-back-compat`
loomx.loom_version=1.17-SNAPSHOT
loomx.loom_remap_plugin=dev.architectury.loom
loomx.loom_unobf_plugin=dev.architectury.loom-no-remap