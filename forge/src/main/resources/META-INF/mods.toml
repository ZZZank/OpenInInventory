modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "${license}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${authors}"
description = '''${description}'''
logoFile = "icon.png"
logoBlur = false

[[mixins]]
config = "template-common.mixins.json"

[[dependencies.${id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${id}]]
    modId = "architectury"
    mandatory = true
    versionRange = "[0.0,)" # the default value can't be used for optional dependencies
    ordering = "NONE"
    side = "BOTH"
