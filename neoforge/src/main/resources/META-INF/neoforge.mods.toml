modLoader = "javafml"
loaderVersion = "*"
license = "LGPL-3.0"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "Zank"
description = "Open guidebooks, backpacks, handhelds and more with a single click in inventory"
logoFile = "assets/${id}/icon.png"
logoBlur = false

[[mixins]]
config = "template-common.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"

[[dependencies.${id}]]
modId = "architectury"
mandatory = true