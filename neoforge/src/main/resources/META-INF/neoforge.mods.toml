modLoader = "javafml"
loaderVersion = "*"
license = "${license}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${authors}"
description = '''${description}'''
logoFile = "icon.png"
logoBlur = false

[[mixins]]
config = "template-common.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"

[[dependencies.${id}]]
modId = "architectury"
mandatory = true
versionRange = "[0.0,)" # for some reason you can't just leave it to be the default value
