# Centralized build properties for all versions and loaders.
# See https://stonecutter.kikugie.dev/wiki/config/properties
#
# Top-level keys apply to every node. Tables tagged with a Minecraft version
# (e.g. ["1.20.1"]) or a loader+version (e.g. [forge."1.20.1"]) apply only to
# the matching nodes - the tags are registered in `stonecutter.gradle.kts`.

mod.id = "open_in_inventory"
mod.name = "Open In Inventory"
mod.group = "zank.mods"
mod.version = "2.0.2"
mod.authors = "Zank"
mod.license = "LGPL-3.0"
mod.description = "Open guidebooks, backpacks, handhelds and more with a single click in inventory"

# Loom variant used by `dev.kikugie.loom-back-compat` for Fabric nodes
loomx.loom_version = "1.17-SNAPSHOT"

# debug / release / beta / alpha
# debug -> debug mode, no file will be actually uploaded
publish.type = "release"

publish.modrinth = "zzHF1h48"
publish.curseforge = "1450235"
publish.github = "[GitHub repo, for example: ZZZank/OpenInInventory]"


